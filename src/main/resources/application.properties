spring.application.name=famous-quote-quiz-backend

spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

auth.secret=${AUTH_SECRET:famous-quote-quiz-development-secret-key}
auth.token-ttl=15m
auth.refresh-token-ttl=30d
quiz.questions-per-session=10
quiz.multiple-choice-options=4